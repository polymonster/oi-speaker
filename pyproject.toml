[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oi-speaker"
version = "0.1.0"
requires-python = ">= 3.10"
dependencies = [
    "sounddevice",
    "openwakeword @ git+https://github.com/dscripka/openWakeWord.git",
    "setuptools<71; sys_platform == 'darwin'",
    "litellm",
    "ddgs",
    "yt-dlp",
    "python-mpv",
    "mutagen",  # tags of the music library's files
    "speexdsp-ns; sys_platform == 'linux'",
    "fastapi[standard]",
    "tomli-w",
    "zeroconf>=0.131.0",
    "httpx>=0.27.0",
    "silero-vad",
    "pyusb",
    "libusb-package; sys_platform == 'win32'",
    "pycaw; sys_platform == 'win32'",
]

[project.optional-dependencies]
# speech to text backends: install one or more, the settings ui offers whichever are present.
# the openai cloud backend needs no extra (litellm already brings the openai sdk)
whisper = ["faster-whisper"]
parakeet = ["onnx-asr[hub]"]
# text to speech backends, the same way. openai needs no extra here either
piper = ["piper-tts"]
kokoro = ["kokoro-onnx"]
chatterbox = ["chatterbox-tts", "setuptools<81"]  # its watermarker still imports pkg_resources
training = [
    "piper-tts",  # generate-positives synthesises wake word samples with piper
    "scipy",
    "scikit-learn",
    "torch",
    "torchaudio",
    "onnx",
    "onnxscript",
    "soxr",
    "matplotlib",
]
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
    "nvidia-cuda-runtime-cu12",
]

[project.scripts]
speaker = "speaker:main"
xvf3800 = "xvf3800:main"
tts-record = "tts_record:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/speaker.py", "src/web.py", "src/xvf3800.py", "src/tts_record.py", "src/backends.py", "src/transcribe.py", "src/voice.py", "src/alarms.py", "src/library.py", "src/static"]