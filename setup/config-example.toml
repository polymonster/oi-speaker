[network]
name = "living-room"
port = 8000

[inference]
# seconds of continuous silence that end a recording. raise it if the speaker cuts you off
# mid-sentence, lower it to shave latency off every turn
silence_timeout = 1.6
# silero speech probability above which a frame counts as speech. raise it in a noisy room
vad_threshold = 0.5

# Speech to text. backend is whisper, parakeet or openai — install the local ones with
# pip install -e ".[whisper]" / ".[parakeet]". The settings tab only offers what is installed, and
# lists the models, devices and compute types this machine supports. Ignored under --worker-ip.
[transcribe]
backend = "whisper"

[transcribe.whisper]
model = "small"
device = "cpu"          # or "cuda"
compute_type = "int8"   # "float16" on cuda

[transcribe.parakeet]
model = "nemo-parakeet-tdt-0.6b-v2"
device = "cpu"
quantization = "int8"   # or "none"

# uses the openai key under [llm.keys]
[transcribe.openai]
model = "gpt-4o-mini-transcribe"

# The voice, the same way. backend is piper, kokoro, chatterbox or openai — install the local ones
# with pip install -e ".[piper]" / ".[kokoro]" / ".[chatterbox]". Ignored under --worker-ip.
[voice]
backend = "piper"

[voice.piper]
model = "models/piper/en_GB-northern_english_male-medium.onnx"
device = "cpu"

# the voice's first letter is its accent: a american, b british
[voice.kokoro]
model = "models/kokoro/kokoro-v1.0.onnx"
voice = "bm_george"
device = "cpu"

# Chatterbox Turbo wants a gpu ("cuda", or "mps" on apple silicon)
[voice.chatterbox]
device = "cpu"
# a 5s+ wav to clone the voice from, empty for chatterbox's built-in voice
reference = ""

# uses the openai key under [llm.keys]. instructions steers tone and accent (gpt-4o-mini-tts only)
[voice.openai]
model = "gpt-4o-mini-tts"
voice = "ash"
instructions = ""

[audio]
input_device = "your-input-device"
output_device = "your-output-device"
# Volume level while listening/processing after wake (0 = muted, 100 = full). Default: 0.
duck_volume = 0
# Downmix playback to mono, for a device with a single speaker. Default: false.
mono_output = false

[library]
# Folders of music to search and play, e.g. a usb drive: ["/media/usb"], or ["F:/"] on Windows.
# Leave empty to only stream.
paths = []

[llm]
# Vendor whose key is used: anthropic, openai, gemini, openrouter or ollama. All of this can be set
# from the settings tab in the web ui instead.
provider = "anthropic"
# litellm "vendor/model" names, e.g. "openai/gpt-5.5", "gemini/gemini-3.5-flash",
# "ollama_chat/qwen3". https://docs.litellm.ai/docs/providers
model = "anthropic/claude-opus-5"
# Follow-up turns (after follow_on or an interrupt) already carry full context, so a cheaper model
# copes. Prompt caches are per-model though, so a split means two cached prefixes and a cache write
# on each switch — set this equal to `model` to collapse back to one.
followup_model = "anthropic/claude-sonnet-5"
# Thinking stays on where the model has it; effort controls how much. Raise to "medium" if answers
# feel shallow.
effort = "low"
# Only for ollama or another self-hosted server. Ollama defaults to http://localhost:11434
api_base = ""

# One key per vendor, so switching back and forth keeps them. Empty falls back to the vendor's usual
# environment variable (ANTHROPIC_API_KEY, OPENAI_API_KEY, ...). Ollama needs none.
[llm.keys]
anthropic = ""
openai = ""
gemini = ""
openrouter = ""

[meta]
confidential = ["llm.keys.anthropic", "llm.keys.openai", "llm.keys.gemini", "llm.keys.openrouter"]

# Add hints to give the assistant context about you and your preferences.
# Hints appear in the system prompt. Add as many [[hints]] blocks as you like.

