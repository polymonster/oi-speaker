<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>oi-speaker</title>
<style>
  @font-face {
    font-family: 'Cousine';
    src: url('/static/fonts/cousine_regular.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: 'Cousine', monospace; background: #111; color: #eee; padding: 0 16px; display: flex; flex-direction: column; font-size: 18px; }
  h1 { color: #eee; font-size: 1.2em; margin: 16px 0 2px; }
  #host-ip { color: #333; font-size: 0.9em; margin-bottom: 12px; }
  /* wrap — six single-word buttons overflow a phone viewport, and body is overflow:hidden so
     anything past the right edge is clipped with no way to scroll to it */
  nav { display: flex; flex-wrap: wrap; gap: 6px 4px; margin-bottom: 12px; border-bottom: 1px solid #222; padding-bottom: 10px; }
  nav button { background: none; border: none; color: #555; padding: 4px 10px; cursor: pointer; font-family: 'Cousine', monospace; font-size: 1em; }
  nav button.active { color: #eee; border-bottom: 2px solid #eee; }

  /* console */
  #console-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  #console-toolbar button { background: none; border: 1px solid #333; color: #555; padding: 4px 10px; cursor: pointer; font-family: 'Cousine', monospace; font-size: 0.85em; }
  #console-toolbar button:hover { border-color: #555; color: #eee; }
  #console-log { flex: 1; overflow-y: auto; border: 1px solid #222; padding: 10px 14px; font-size: 0.82em; line-height: 1.5; white-space: pre-wrap; word-break: break-all; }
  .log-line { color: #aaa; }
  .log-line.warn { color: #fa7; }
  .log-line.err  { color: #f66; }
  .log-ts { color: #444; margin-right: 8px; user-select: none; }
  section { display: none; }
  section.active { display: flex; flex-direction: column; flex: 1; overflow: hidden; }

  /* chat */
  #chat-log { flex: 1; overflow-y: auto; border: 1px solid #222; padding: 14px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px; }
  .msg { font-size: 1em; line-height: 1.5; }
  .msg.user { color: #7af; }
  .msg.bot { color: #afa; }
  .msg.bot.action { color: #fa7; }
  #chat-form { display: flex; gap: 8px; padding-bottom: 16px; }
  #chat-input { flex: 1; background: #1a1a1a; border: 1px solid #333; color: #eee; padding: 10px 14px; font-family: 'Cousine', monospace; font-size: 1em; outline: none; }
  #chat-input:focus { border-color: #555; }
  .send-btn { background: #222; border: 1px solid #444; color: #eee; padding: 10px 18px; cursor: pointer; font-family: 'Cousine', monospace; font-size: 1em; }
  .send-btn:hover { background: #2a2a2a; }

  /* settings */
  #settings { overflow-y: auto; overflow-x: auto; }
  .hint-row { min-width: max-content; }
  .setting { margin-bottom: 14px; }
  .setting label { display: block; color: #666; font-size: 0.85em; margin-bottom: 4px; }
  .setting input, .setting select { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #eee; padding: 8px 10px; font-family: 'Cousine', monospace; font-size: 1em; outline: none; }
  .setting input:focus, .setting select:focus { border-color: #555; }
  .secret-wrap { display: flex; }
  .secret-wrap input { flex: 1; border-right: none; }
  .eye-btn { background: #1a1a1a; border: 1px solid #333; border-left: none; color: #444; padding: 0 10px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; }
  .eye-btn:hover { color: #aaa; }
  .eye-btn svg { display: block; }
  .setting select { appearance: none; cursor: pointer; }
  .section-header { color: #444; font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.1em; margin: 20px 0 10px; border-bottom: 1px solid #1e1e1e; padding-bottom: 6px; }
  .hint-block { margin-bottom: 8px; }
  .hint-row { display: flex; gap: 8px; align-items: center; }
  .hint-row + .hint-row { margin-top: 4px; }
  .hint-row input { background: #1a1a1a; border: 1px solid #333; color: #eee; padding: 8px 10px; font-family: 'Cousine', monospace; font-size: 1em; outline: none; }
  .hint-row input:focus { border-color: #555; }
  .hint-row .name-input { width: 130px; flex-shrink: 0; }
  .hint-row .cat-input  { width: 90px; flex-shrink: 0; }
  .hint-row .val-input  { flex: 1; }
  .hint-row .extra-input { flex: 1; color: #aaa; }
  .rm-btn { background: none; border: 1px solid #333; color: #555; padding: 8px 10px; cursor: pointer; font-family: 'Cousine', monospace; flex-shrink: 0; }
  .rm-btn:hover { border-color: #a44; color: #f66; }
  .extra-btn { background: none; border: none; color: #444; padding: 8px 4px; cursor: pointer; font-family: 'Cousine', monospace; font-size: 0.85em; flex-shrink: 0; white-space: nowrap; }
  .extra-btn:hover { color: #888; }
  .add-btn { background: none; border: 1px solid #333; color: #555; padding: 8px 14px; cursor: pointer; font-family: 'Cousine', monospace; margin-top: 4px; }
  .add-btn:hover { border-color: #555; color: #eee; }
  #save-btn { background: #222; border: 1px solid #444; color: #eee; padding: 10px 20px; cursor: pointer; font-family: 'Cousine', monospace; margin-top: 16px; font-size: 1em; }
  #save-btn:hover { background: #2a2a2a; }
  #cancel-btn { display: none; background: none; border: 1px solid #444; color: #888; padding: 10px 20px; cursor: pointer; font-family: 'Cousine', monospace; margin-top: 16px; font-size: 1em; margin-left: 8px; }
  #cancel-btn:hover { color: #eee; border-color: #666; }
  .llm-test { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .llm-test button { background: none; border: 1px solid #333; color: #888; padding: 8px 14px; cursor: pointer; font-family: 'Cousine', monospace; font-size: 0.9em; flex-shrink: 0; }
  .llm-test button:hover { border-color: #555; color: #eee; }
  .llm-test-result { font-size: 0.85em; word-break: break-word; }
  .llm-test-result.ok { color: #afa; }
  .llm-test-result.err { color: #f66; }
  #save-feedback { color: #afa; font-size: 0.9em; margin-left: 12px; opacity: 0; transition: opacity 0.3s; }

  /* status */

  /* speakers */
  .peer-card { border: 1px solid #222; padding: 12px 16px; display: flex; align-items: center; gap: 16px; }
  .peer-status { font-size: 0.8em; padding: 2px 8px; border: 1px solid; flex-shrink: 0; }
  .peer-status.online { color: #afa; border-color: #afa; }
  .peer-status.offline { color: #555; border-color: #333; }
  .peer-open { background: none; border: 1px solid #444; color: #888; padding: 6px 14px; cursor: pointer; font-family: 'Cousine', monospace; font-size: 0.9em; flex-shrink: 0; }
  .peer-open:hover { border-color: #888; color: #eee; }

  /* timeline */
  #tl-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }
  #tl-toolbar button { background: none; border: 1px solid #333; color: #555; padding: 4px 10px; cursor: pointer; font-family: 'Cousine', monospace; font-size: 0.85em; }
  #tl-toolbar button:hover { border-color: #555; color: #eee; }
  #tl-toolbar button.on { border-color: #555; color: #eee; }
  #tl-live.on { border-color: #afa; color: #afa; }
  #tl-capture.on { border-color: #fa7; color: #fa7; }
  .tl-key { color: #555; font-size: 0.75em; display: flex; align-items: center; gap: 4px; }
  .tl-key i { width: 8px; height: 8px; flex-shrink: 0; }
  #tl-state { color: #7af; font-size: 0.8em; padding: 2px 8px; border: 1px solid #333; margin-left: auto; }
  #tl-db { color: #555; font-size: 0.8em; min-width: 5.5em; text-align: right; }
  #tl-canvas { width: 100%; height: 200px; border: 1px solid #222; touch-action: none; cursor: grab; display: block; flex-shrink: 0; }
  #tl-canvas.dragging { cursor: grabbing; }
  #tl-markers { flex: 1; overflow-y: auto; border: 1px solid #222; border-top: none; padding: 8px 12px; font-size: 0.8em; line-height: 1.5; }
  .tl-mark { display: flex; gap: 10px; padding: 2px 0; }
  .tl-mark-ts { color: #444; white-space: nowrap; flex-shrink: 0; }
  .tl-mark-kind { width: 9em; flex-shrink: 0; }
  .tl-mark-text { color: #888; word-break: break-word; }

  /* history */
  #history-list { flex: 1; overflow-y: auto; border: 1px solid #222; padding: 10px 14px; }
  .play-entry { display: flex; align-items: baseline; gap: 12px; padding: 5px 0; border-bottom: 1px solid #1a1a1a; }
  .play-entry:last-child { border-bottom: none; }
  .play-ts { color: #444; font-size: 0.78em; white-space: nowrap; flex-shrink: 0; }
  .play-link { color: #7af; text-decoration: none; font-size: 0.88em; word-break: break-all; }
  .play-link:hover { color: #adf; text-decoration: underline; }

  /* desktop overrides */
  @media (min-width: 768px) {
    html, body { height: auto; overflow: auto; }
    body { max-width: 760px; margin: 40px auto; display: block; font-size: 16px; }
    section.active { display: block; flex: none; overflow: visible; }
    #settings { overflow-y: visible; }
    #chat-log { flex: none; height: 420px; }
    #chat-form { padding-bottom: 0; }
    #console-log { height: 520px; flex: none; }
    #history-list { height: 520px; flex: none; }
    #tl-canvas { height: 280px; }
    #tl-markers { height: 240px; flex: none; }
  }
</style>
</head>
<body>
<h1 id="greeting">oi-speaker</h1>
<div id="host-ip"></div>
<nav>
  <button class="active" onclick="show('chat', this)">chat</button>
  <button onclick="show('settings', this)">settings</button>
  <button onclick="show('console', this)">console</button>
  <button onclick="show('speakers', this)">speakers</button>
  <button onclick="show('history', this)">history</button>
  <button onclick="show('timeline', this)">timeline</button>
</nav>

<section id="chat" class="active">
  <div id="chat-log"></div>
  <form id="chat-form">
    <input id="chat-input" type="text" placeholder="say something..." autocomplete="off">
    <button class="send-btn" type="submit">send</button>
  </form>
</section>

<section id="console">
  <div id="console-toolbar">
    <button onclick="clearConsole()">clear</button>
    <label style="color:#555;font-size:0.85em;cursor:pointer;">
      <input type="checkbox" id="autoscroll" checked style="margin-right:4px;">auto-scroll
    </label>
  </div>
  <div id="console-log"></div>
</section>

<section id="speakers">
  <div id="speakers-list" style="display:flex;flex-direction:column;gap:10px;margin-top:8px;"></div>
</section>

<section id="history">
  <div id="history-list"></div>
</section>

<section id="timeline">
  <div id="tl-toolbar">
    <button id="tl-capture" onclick="toggleCapture()">capture off</button>
    <button class="tl-win" onclick="setWindow(10, this)">10s</button>
    <button class="tl-win on" onclick="setWindow(30, this)">30s</button>
    <button class="tl-win" onclick="setWindow(60, this)">60s</button>
    <button id="tl-live" class="on" onclick="goLive()">&bull; live</button>
    <span class="tl-key"><i style="background:#333"></i>peak</span>
    <span class="tl-key"><i style="background:#7af"></i>level</span>
    <span class="tl-key"><i style="background:#afa"></i>voice</span>
    <span id="tl-db">-inf dB</span>
    <span id="tl-state">--</span>
  </div>
  <canvas id="tl-canvas"></canvas>
  <div id="tl-markers"></div>
</section>

<section id="settings">
  <div id="settings-form"></div>
  <div style="display:flex;align-items:center;">
    <button id="save-btn" onclick="saveSettings()">save</button>
    <button id="cancel-btn" onclick="cancelSettings()">cancel</button>
    <span id="save-feedback">saved</span>
  </div>
</section>


<script>
const GREETINGS = ['Oi! Oi!!', 'Hold Tight!', 'Yes, Mate!', "'Av It!!"];
document.getElementById('greeting').textContent = GREETINGS[Math.floor(Math.random() * GREETINGS.length)];

let settingsData = {};

function show(id, btn) {
  document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
  if (id === 'settings') loadSettings();
  if (id === 'history') loadPlayHistory();
  if (id === 'timeline') startTimeline(); else stopTimeline();
}

// chat
let historyLen = 0;

document.getElementById('chat-form').addEventListener('submit', async e => {
  e.preventDefault();
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.disabled = true;
  // Show user message immediately without waiting for server
  addMsg('user', '> ' + text);
  historyLen++;
  // Poll frequently while waiting for the response to arrive
  const fastPoll = setInterval(syncHistory, 500);
  try {
    await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    await syncHistory();
  } catch {
    addMsg('bot action', '< error');
  } finally {
    clearInterval(fastPoll);
    input.disabled = false;
    input.focus();
  }
});

function addMsg(cls, text) {
  const log = document.getElementById('chat-log');
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

async function syncHistory() {
  try {
    const res = await fetch('/history');
    const entries = await res.json();
    for (let i = historyLen; i < entries.length; i++) {
      const e = entries[i];
      if (e.role === 'user') addMsg('user', '> ' + e.text);
      else addMsg('bot', '< ' + e.text);
    }
    historyLen = entries.length;
  } catch {}
}

// populated from config meta.confidential after settings load
let CONFIDENTIAL_PATHS = new Set();

function toggleSecret(btn) {
  const input = btn.previousElementSibling;
  const showing = input.type === 'text';
  input.type = showing ? 'password' : 'text';
  btn.querySelector('.eye-closed').style.display = showing ? 'none' : '';
  btn.querySelector('.eye-open').style.display = showing ? '' : 'none';
}

// settings
let audioDevices = { inputs: [], outputs: [] };
let originalData = {};

function markDirty() {
  document.getElementById('cancel-btn').style.display = '';
}

function clearDirty() {
  document.getElementById('cancel-btn').style.display = 'none';
}

async function loadSettings() {
  try {
    const [settingsRes, devicesRes] = await Promise.all([fetch('/settings'), fetch('/audio-devices')]);
    settingsData = await settingsRes.json();
    audioDevices = await devicesRes.json();
  } catch(e) {
    document.getElementById('settings-form').textContent = 'Error loading settings: ' + e;
    return;
  }
  originalData = JSON.parse(JSON.stringify(settingsData));
  CONFIDENTIAL_PATHS = new Set(settingsData.meta?.confidential ?? []);
  clearDirty();
  const form = document.getElementById('settings-form');
  form.innerHTML = '';

  // Sync-from-peer row
  let peers = [];
  try { peers = (await fetch('/peers').then(r => r.json())).filter(p => p.online); } catch {}
  if (peers.length) {
    const syncHeader = document.createElement('div');
    syncHeader.className = 'section-header';
    syncHeader.textContent = 'sync from peer';
    form.appendChild(syncHeader);
    const syncRow = document.createElement('div');
    syncRow.style.cssText = 'display:flex;gap:8px;margin-bottom:14px;';
    const sel = document.createElement('select');
    sel.id = 'sync-peer-select';
    sel.style.cssText = 'flex:1;background:#1a1a1a;border:1px solid #333;color:#eee;padding:8px 10px;font-family:\'Cousine\',monospace;font-size:1em;outline:none;appearance:none;cursor:pointer;';
    peers.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.name;
      opt.textContent = p.name + ' (' + p.ip + ')';
      sel.appendChild(opt);
    });
    const syncBtn = document.createElement('button');
    syncBtn.type = 'button';
    syncBtn.textContent = 'sync';
    syncBtn.style.cssText = 'background:#222;border:1px solid #444;color:#eee;padding:8px 18px;cursor:pointer;font-family:\'Cousine\',monospace;font-size:1em;';
    syncBtn.onclick = () => syncConfig(sel.value);
    syncRow.appendChild(sel);
    syncRow.appendChild(syncBtn);
    form.appendChild(syncRow);
  }

  // llm first — vendor and key are the first thing a new box needs
  const llmContainer = document.createElement('div');
  llmContainer.id = 'llm-container';
  form.appendChild(llmContainer);
  await renderLlm(llmContainer);

  renderObj(form, settingsData, []);

  // Hints — always rendered explicitly so it's never silently skipped
  const hintsHeader = document.createElement('div');
  hintsHeader.className = 'section-header';
  hintsHeader.textContent = 'hints';
  form.appendChild(hintsHeader);
  const hintsContainer = document.createElement('div');
  hintsContainer.id = 'hints-container';
  form.appendChild(hintsContainer);
  if (!settingsData.hints) settingsData.hints = [];
  renderHints(hintsContainer, settingsData.hints);
  const addBtn = document.createElement('button');
  addBtn.className = 'add-btn';
  addBtn.textContent = '+ add hint';
  addBtn.onclick = () => {
    settingsData.hints.push({ name: '', category: '', text: '' });
    renderHints(hintsContainer, settingsData.hints);
    markDirty();
  };
  form.appendChild(addBtn);
  form.addEventListener('input', markDirty);
}

function renderObj(container, obj, path) {
  for (const [key, val] of Object.entries(obj)) {
    if (key === 'hints' || key === 'meta' || (key === 'llm' && path.length === 0)) {
      continue; // hints and llm rendered explicitly; meta is internal
    } else if (Array.isArray(val) && val.length > 0 && typeof val[0] === 'object') {
      continue; // other arrays of objects — skip
    } else if (typeof val === 'object' && !Array.isArray(val)) {
      const h = document.createElement('div');
      h.className = 'section-header';
      h.textContent = key;
      container.appendChild(h);
      renderObj(container, val, [...path, key]);
    } else {
      const fullPath = [...path, key].join('.');
      const div = document.createElement('div');
      div.className = 'setting';
      const deviceOptions = fullPath === 'audio.input_device' ? audioDevices.inputs
                          : fullPath === 'audio.output_device' ? audioDevices.outputs
                          : null;
      if (typeof val === 'boolean') {
        div.innerHTML = `<label>${fullPath}</label><input type="checkbox" data-path="${fullPath}"${val ? ' checked' : ''}>`;
      } else if (deviceOptions && deviceOptions.length > 0) {
        const opts = deviceOptions.map(name => {
          const selected = name === val ? ' selected' : '';
          return `<option value="${name}"${selected}>${name}</option>`;
        }).join('');
        div.innerHTML = `<label>${fullPath}</label><select data-path="${fullPath}">${opts}</select>`;
      } else if (CONFIDENTIAL_PATHS.has(fullPath)) {
        div.innerHTML = `<label>${fullPath}</label>
          <div class="secret-wrap">
            <input type="password" data-path="${fullPath}" value="${val}">
            <button class="eye-btn" type="button" onclick="toggleSecret(this)" title="toggle visibility">
              <svg class="eye-open" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-closed" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>`;
      } else {
        div.innerHTML = `<label>${fullPath}</label><input data-path="${fullPath}" value="${Array.isArray(val) ? val.join(', ') : val}">`;
      }
      container.appendChild(div);
    }
  }
}

// llm — vendor, its key, models and effort. built by hand rather than by renderObj: only the chosen
// vendor's key is shown, and the model lists depend on the vendor
let llmProviders = null;  // {providers, efforts} from /llm/providers, fetched once

function settingRow(label, control) {
  const div = document.createElement('div');
  div.className = 'setting';
  const l = document.createElement('label');
  l.textContent = label;
  div.appendChild(l);
  div.appendChild(control);
  return div;
}

function pathInput(path, value, attrs = {}) {
  const input = document.createElement('input');
  input.dataset.path = path;
  input.value = value ?? '';
  Object.assign(input, attrs);
  return input;
}

function modelBelongsTo(model, provider) {
  // "ollama_chat/qwen3" belongs to ollama, "openrouter/x" does not belong to openai
  return (model || '').split('/')[0].startsWith(provider);
}

async function renderLlm(container) {
  if (!llmProviders) {
    try { llmProviders = await fetch('/llm/providers').then(r => r.json()); }
    catch (e) { container.textContent = 'Error loading llm providers: ' + e; return; }
  }
  const llm = settingsData.llm;
  const providers = llmProviders.providers;
  const spec = providers[llm.provider] || {};
  container.innerHTML = '';

  const header = document.createElement('div');
  header.className = 'section-header';
  header.textContent = 'llm';
  container.appendChild(header);

  const vendor = document.createElement('select');
  vendor.dataset.path = 'llm.provider';
  for (const [name, p] of Object.entries(providers)) {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = p.label + (p.needs_key && llm.keys?.[name] ? '  ✓' : '');
    vendor.appendChild(opt);
  }
  // a provider set by hand in config.toml that the ui does not list still shows, and still saves
  if (!providers[llm.provider]) {
    const opt = document.createElement('option');
    opt.value = opt.textContent = llm.provider;
    vendor.appendChild(opt);
  }
  vendor.value = llm.provider;
  vendor.onchange = () => switchLlmProvider(container, vendor.value);
  container.appendChild(settingRow('vendor', vendor));

  if (spec.needs_key !== false) {
    llm.keys ??= {};
    llm.keys[llm.provider] ??= '';
    const wrap = document.createElement('div');
    wrap.className = 'secret-wrap';
    wrap.appendChild(pathInput(`llm.keys.${llm.provider}`, llm.keys[llm.provider], { type: 'password', placeholder: 'api key' }));
    wrap.insertAdjacentHTML('beforeend', `<button class="eye-btn" type="button" onclick="toggleSecret(this)" title="toggle visibility">
        <svg class="eye-open" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
        </svg>
        <svg class="eye-closed" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
      </button>`);
    container.appendChild(settingRow('api key', wrap));
  }

  if (spec.needs_api_base) {
    llm.api_base ??= '';
    container.appendChild(settingRow('api base', pathInput('llm.api_base', llm.api_base, { placeholder: spec.default_api_base || '' })));
  }

  // free text backed by a datalist — the list suggests, but a model newer than litellm's registry
  // can still be typed in
  const list = document.createElement('datalist');
  list.id = 'llm-models';
  container.appendChild(list);
  for (const [label, path, placeholder] of [['model', 'model', spec.default_model], ['followup model', 'followup_model', spec.default_followup]]) {
    const input = pathInput(`llm.${path}`, llm[path], { placeholder: placeholder || '' });
    input.setAttribute('list', 'llm-models');
    container.appendChild(settingRow(label, input));
  }

  const effort = document.createElement('select');
  effort.dataset.path = 'llm.effort';
  const efforts = [...llmProviders.efforts];
  if (llm.effort && !efforts.includes(llm.effort)) efforts.push(llm.effort);  // a hand-set "max" survives
  for (const e of efforts) {
    const opt = document.createElement('option');
    opt.value = opt.textContent = e;
    effort.appendChild(opt);
  }
  effort.value = llm.effort || 'low';
  container.appendChild(settingRow('effort', effort));

  const test = document.createElement('div');
  test.className = 'llm-test';
  test.innerHTML = `<button type="button">test</button><span class="llm-test-result"></span>`;
  test.querySelector('button').onclick = () => testLlm(container, test.querySelector('.llm-test-result'));
  container.appendChild(test);

  const base = llm.api_base || '';
  fetch(`/llm/models?provider=${encodeURIComponent(llm.provider)}&api_base=${encodeURIComponent(base)}`)
    .then(r => r.ok ? r.json() : [])
    .then(models => {
      for (const m of models) {
        const opt = document.createElement('option');
        opt.value = m;
        list.appendChild(opt);
      }
    })
    .catch(() => {});
}

function switchLlmProvider(container, provider) {
  // keep what was typed into the section before it is rebuilt for the new vendor
  collectPaths(container);
  const llm = settingsData.llm;
  const spec = llmProviders.providers[provider] || {};
  llm.provider = provider;
  if (!modelBelongsTo(llm.model, provider)) llm.model = spec.default_model || '';
  if (!modelBelongsTo(llm.followup_model, provider)) llm.followup_model = spec.default_followup || llm.model;
  renderLlm(container);
  markDirty();
}

async function testLlm(container, out) {
  collectPaths(container);
  const llm = settingsData.llm;
  out.className = 'llm-test-result';
  out.textContent = 'testing...';
  try {
    const res = await fetch('/llm/test', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        provider: llm.provider,
        model: llm.model,
        api_key: llm.keys?.[llm.provider] || '',
        api_base: llm.api_base || '',
      })
    }).then(r => r.json());
    out.className = 'llm-test-result ' + (res.ok ? 'ok' : 'err');
    out.textContent = res.ok ? 'ok' : res.error;
  } catch (e) {
    out.className = 'llm-test-result err';
    out.textContent = String(e);
  }
}

function renderHints(container, hints) {
  container.innerHTML = '';
  hints.forEach((hint, i) => {
    const val = hint.url || hint.text || '';
    const hasExtra = 'extra_info' in hint;
    const block = document.createElement('div');
    block.className = 'hint-block';
    block.innerHTML = `
      <div class="hint-row">
        <input class="name-input" data-hint="${i}" data-field="name"     value="${hint.name}"     placeholder="name">
        <input class="cat-input"  data-hint="${i}" data-field="category" value="${hint.category}" placeholder="category">
        <input class="val-input"  data-hint="${i}" data-field="value"    value="${val}"           placeholder="url or text">
        <button class="rm-btn" onclick="removeHint(${i})">✕</button>
        ${hasExtra ? `<button class="extra-btn" style="visibility:hidden">+ extra</button>` : `<button class="extra-btn" onclick="addExtraInfo(${i})">+ extra</button>`}
      </div>
      ${hasExtra ? `
      <div class="hint-row">
        <input class="extra-input" data-hint="${i}" data-field="extra_info" value="${hint.extra_info}" placeholder="extra info">
      </div>` : ''}
    `;
    container.appendChild(block);
  });
}

function addExtraInfo(i) {
  settingsData.hints[i].extra_info = '';
  renderHints(document.getElementById('hints-container'), settingsData.hints);
  markDirty();
}

function removeHint(i) {
  settingsData.hints.splice(i, 1);
  renderHints(document.getElementById('hints-container'), settingsData.hints);
  markDirty();
}

function cancelSettings() {
  settingsData = JSON.parse(JSON.stringify(originalData));
  loadSettings();
}

// write every data-path input under `root` back into settingsData
function collectPaths(root) {
  root.querySelectorAll('[data-path]').forEach(input => {
    const keys = input.dataset.path.split('.');
    let obj = settingsData;
    for (let i = 0; i < keys.length - 1; i++) obj = obj[keys[i]];
    const lastKey = keys[keys.length - 1];
    const orig = obj[lastKey];
    obj[lastKey] = input.type === 'checkbox'
      ? input.checked
      : Array.isArray(orig)
        ? input.value.split(',').map(s => s.trim()).filter(Boolean)
        : input.value;
  });
}

async function saveSettings() {
  collectPaths(document);
  // collect hints — value goes to url or text depending on content
  document.querySelectorAll('[data-hint]').forEach(input => {
    const i = parseInt(input.dataset.hint);
    const field = input.dataset.field;
    if (field === 'value') {
      const v = input.value;
      if (v.startsWith('http')) {
        settingsData.hints[i].url = v;
        delete settingsData.hints[i].text;
      } else {
        settingsData.hints[i].text = v;
        delete settingsData.hints[i].url;
      }
    } else {
      settingsData.hints[i][field] = input.value;
    }
  });
  await fetch('/settings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(settingsData)
  });
  originalData = JSON.parse(JSON.stringify(settingsData));
  clearDirty();
  const fb = document.getElementById('save-feedback');
  fb.style.opacity = 1;
  setTimeout(() => fb.style.opacity = 0, 2000);
}

// console log
let logSince = 0;

function clearConsole() {
  document.getElementById('console-log').innerHTML = '';
  logSince = 0;
}

function _logClass(text) {
  const t = text.toLowerCase();
  if (t.includes('error') || t.includes('traceback') || t.includes('exception')) return 'err';
  if (t.includes('warn') || t.includes('yt-dlp error')) return 'warn';
  return '';
}

async function syncConsole() {
  try {
    const res = await fetch('/logs?since=' + logSince);
    const data = await res.json();
    if (!data.lines.length) return;
    const el = document.getElementById('console-log');
    const autoscroll = document.getElementById('autoscroll').checked;
    for (const entry of data.lines) {
      const d = document.createElement('div');
      d.className = 'log-line ' + _logClass(entry.text);
      const ts = new Date(entry.ts * 1000).toLocaleTimeString();
      d.innerHTML = `<span class="log-ts">${ts}</span>${entry.text.replace(/</g, '&lt;')}`;
      el.appendChild(d);
      logSince = entry.index;
    }
    if (autoscroll) el.scrollTop = el.scrollHeight;
  } catch {}
}

// play history tab
function _playLabel(url) {
  try {
    const u = new URL(url);
    if (u.hostname.includes('youtube.com') || u.hostname.includes('youtu.be')) {
      const vid = u.searchParams.get('v') || u.pathname.replace(/^\//, '');
      return `youtube.com/watch?v=${vid}`;
    }
    return u.hostname + (u.pathname && u.pathname !== '/' ? u.pathname : '');
  } catch { return url; }
}

async function loadPlayHistory() {
  try {
    const entries = await fetch('/play-history').then(r => r.json());
    const el = document.getElementById('history-list');
    if (!entries.length) {
      el.innerHTML = '<div style="color:#444;font-size:0.9em;margin-top:8px;">no play history yet...</div>';
      return;
    }
    el.innerHTML = '';
    for (const entry of [...entries].reverse()) {
      const div = document.createElement('div');
      div.className = 'play-entry';
      const ts = new Date(entry.ts * 1000).toLocaleString();
      const label = entry.title || _playLabel(entry.url);
      div.innerHTML = `<span class="play-ts">${ts}</span><a class="play-link" href="${entry.url}" target="_blank" rel="noopener">${label}</a>`;
      el.appendChild(div);
    }
  } catch {}
}

// speakers tab
async function syncSpeakers() {
  try {
    const peers = await fetch('/peers').then(r => r.json());
    const el = document.getElementById('speakers-list');
    el.innerHTML = '';
    if (!peers.length) {
      el.innerHTML = '<div style="color:#444;font-size:0.9em;">no peers discovered yet...</div>';
      return;
    }
    for (const p of peers) {
      const card = document.createElement('div');
      card.className = 'peer-card';
      const badge = `<span class="peer-status ${p.online ? 'online' : 'offline'}">${p.online ? 'online' : 'offline'}</span>`;
      const openBtn = p.online ? `<button class="peer-open" onclick="window.open('http://${p.ip}:${p.port}/','_blank')">open</button>` : '';
      const syncBtn = p.online ? `<button class="peer-open" onclick="syncConfig('${p.name}')">sync cfg</button>` : '';
      card.innerHTML = `<div style="flex:1">${p.name}<br><span style="color:#444;font-size:0.8em;">${p.ip}:${p.port}</span></div>${badge}${openBtn}${syncBtn}`;
      el.appendChild(card);
    }
  } catch {}
}

async function syncConfig(peerName) {
  if (!confirm(`Sync config from "${peerName}"? Local audio + network settings will be preserved, everything else will be overwritten.`)) return;
  try {
    const res = await fetch('/rpc/sync-config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ peer_name: peerName })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      alert('Sync failed: ' + (err.detail || res.status));
      return;
    }
    alert(`Config synced from "${peerName}". Reload settings to see changes.`);
  } catch (e) { alert('Sync error: ' + e); }
}

// timeline tab
const TL_MAX_FRAMES = 2000;   // matches LEVEL_BUFFER_FRAMES server side
const TL_MAX_MARKERS = 200;   // matches MARKER_BUFFER_LEN server side
const TL_LABEL_H = 14;        // marker label strip along the top
const TL_DET_H = 56;          // wake score / vad probability lane
const TL_FLOOR_DB = -60;      // amplitude below this reads as silence
const TL_KIND_COLOURS = {
  wake: '#fa7', interrupt: '#fa7', nudge: '#fa7', record: '#f66', warn: '#f66',
  onset: '#afa', recorded: '#afa', transcribe: '#7af', transcribed: '#7af',
  llm: '#7af', 'llm-done': '#7af'
};

let tlFrames = [];
let tlMarkers = [];
let tlSince = -1;         // cursors are exclusive, so -1 picks up index 0
let tlMarkerSince = -1;
let tlWindow = 30;        // seconds visible
let tlLive = true;        // right edge tracks the newest frame
let tlEnd = 0;            // ts at the right edge while panned back
let tlTimer = null;
let tlRaf = null;
let tlEnabled = false;    // server-owned, learned from the /levels payload
let tlPolling = false;    // one poll in flight at a time — the cursor advances only on response
let tlWakeThreshold = null;
let tlVadThreshold = null;

// amplitudes are 0..1 but speech sits around 0.02-0.1, so a linear bar is invisible. map through
// dBFS with a floor, which is also what makes the height meaningful for judging mic gain
function _tlNorm(v) {
  if (!v) return 0;
  const db = 20 * Math.log10(v);
  return Math.max(0, Math.min(1, (db - TL_FLOOR_DB) / -TL_FLOOR_DB));
}

function startTimeline() {
  if (tlRaf) return;
  renderMarkerList();  // paint the empty-state placeholder before the first poll lands
  syncLevels();        // one poll to pick up whatever the server's capture state already is
  const draw = () => { drawTimeline(); tlRaf = requestAnimationFrame(draw); };
  tlRaf = requestAnimationFrame(draw);
}

function stopTimeline() {
  if (tlTimer) { clearInterval(tlTimer); tlTimer = null; }
  if (tlRaf) { cancelAnimationFrame(tlRaf); tlRaf = null; }
}

// capture is off at every speaker start so the audio thread pays nothing for a debug view nobody is
// watching. the server owns the flag — another phone may have turned it on
async function toggleCapture() {
  const next = !tlEnabled;
  try {
    await fetch('/levels/enable', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ enabled: next })
    });
  } catch { return; }
  if (!next) { tlFrames = []; tlMarkers = []; }
  await syncLevels();
}

function setCaptureUi(enabled) {
  const changed = enabled !== tlEnabled;
  tlEnabled = enabled;
  const btn = document.getElementById('tl-capture');
  btn.textContent = enabled ? 'capture on' : 'capture off';
  btn.classList.toggle('on', enabled);
  // no point polling four times a second for a buffer nothing is filling
  if (enabled && !tlTimer) tlTimer = setInterval(syncLevels, 250);
  if (!enabled && tlTimer) { clearInterval(tlTimer); tlTimer = null; }
  if (!enabled) document.getElementById('tl-db').textContent = '-inf dB';
  // covers a toggle from another phone as well as our own, in both directions
  if (changed) renderMarkerList();
}

async function syncLevels() {
  // the cursor only advances once a response lands, so two polls in flight both ask from the same
  // point and both append the same rows. the pi answers slower than the 250ms tick exactly when it
  // is transcribing and running the llm, which is where the duplicates showed up
  if (document.hidden || tlPolling) return;
  tlPolling = true;
  try {
    const data = await fetch(`/levels?since=${tlSince}&marker_since=${tlMarkerSince}`).then(r => r.json());
    setCaptureUi(data.enabled);
    // the speaker restarted (or capture was cycled) and its counters are behind our cursor — without
    // this the page would sit empty forever, asking for frames that will not be issued again
    if (data.total < tlSince) {
      tlSince = -1; tlMarkerSince = -1; tlFrames = []; tlMarkers = [];
      return;
    }
    // filter on the index as well, so appending stays idempotent whatever arrives
    for (const f of data.frames) if (f.i > tlSince) { tlFrames.push(f); tlSince = f.i; }
    if (tlFrames.length > TL_MAX_FRAMES) tlFrames.splice(0, tlFrames.length - TL_MAX_FRAMES);
    let added = 0;
    for (const m of data.markers) if (m.i > tlMarkerSince) { tlMarkers.push(m); tlMarkerSince = m.i; added++; }
    if (tlMarkers.length > TL_MAX_MARKERS) tlMarkers.splice(0, tlMarkers.length - TL_MAX_MARKERS);
    if (added) renderMarkerList();
    if (tlFrames.length) {
      const last = tlFrames[tlFrames.length - 1];
      document.getElementById('tl-db').textContent =
        last.rms > 0 ? (20 * Math.log10(last.rms)).toFixed(0) + ' dB' : '-inf dB';
    }
  } catch {} finally { tlPolling = false; }
}

function renderMarkerList() {
  const el = document.getElementById('tl-markers');
  if (!tlMarkers.length) {
    el.innerHTML = tlEnabled
      ? '<div style="color:#444;">no events yet — say the wake word...</div>'
      : '<div style="color:#444;">capture is off</div>';
    return;
  }
  el.innerHTML = '';
  for (const m of [...tlMarkers].reverse()) {
    const div = document.createElement('div');
    div.className = 'tl-mark';
    const ts = new Date(m.ts * 1000).toLocaleTimeString();
    const colour = TL_KIND_COLOURS[m.kind] || '#888';
    div.innerHTML = `<span class="tl-mark-ts">${ts}</span>`
      + `<span class="tl-mark-kind" style="color:${colour}">${m.kind}</span>`
      + `<span class="tl-mark-text">${m.text.replace(/</g, '&lt;')}</span>`;
    el.appendChild(div);
  }
}

function setWindow(secs, btn) {
  tlWindow = secs;
  document.querySelectorAll('#tl-toolbar .tl-win').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
}

function goLive() {
  tlLive = true;
  document.getElementById('tl-live').classList.add('on');
}

function drawTimeline() {
  const canvas = document.getElementById('tl-canvas');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  const c = canvas.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, w, h);

  if (!tlFrames.length) {
    c.fillStyle = '#444';
    c.font = "12px 'Cousine', monospace";
    c.textBaseline = 'middle';
    c.fillText(tlEnabled ? 'waiting for audio...' : 'capture is off — press capture to start recording levels', 10, h / 2);
    return;
  }

  // the newest frame is "now" rather than the browser clock — server timestamps are wall clock and
  // the phone's clock may not agree with the pi's
  const latest = tlFrames[tlFrames.length - 1].ts;
  if (tlLive) tlEnd = latest;
  const start = tlEnd - tlWindow;
  const x = ts => (ts - start) / tlWindow * w;

  const detTop = TL_LABEL_H, detBot = TL_LABEL_H + TL_DET_H;
  const waveTop = detBot + 4, waveMid = (waveTop + h) / 2, halfH = (h - waveTop) / 2;

  // lane separators and the detector 0/1 rails
  c.strokeStyle = '#1e1e1e';
  c.lineWidth = 1;
  c.beginPath();
  c.moveTo(0, detBot + 0.5); c.lineTo(w, detBot + 0.5);
  c.moveTo(0, Math.round(waveMid) + 0.5); c.lineTo(w, Math.round(waveMid) + 0.5);
  c.stroke();

  // detector thresholds — dashed, only once we know the real values from /status
  c.setLineDash([3, 4]);
  for (const [thr, colour] of [[tlWakeThreshold, '#456'], [tlVadThreshold, '#465']]) {
    if (thr == null) continue;
    const y = Math.round(detTop + TL_DET_H * (1 - thr)) + 0.5;
    c.strokeStyle = colour;
    c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke();
  }
  c.setLineDash([]);

  // amplitude bars, mirrored about the centre. width comes from the gap to the next frame because
  // the capture rate changes between wake listen (80ms) and recording (32ms)
  for (let i = 0; i < tlFrames.length; i++) {
    const f = tlFrames[i];
    if (f.ts < start - 1 || f.ts > tlEnd) continue;
    const x0 = x(f.ts);
    const next = tlFrames[i + 1];
    const bw = Math.max(1, (next ? x(next.ts) : x0 + w / tlWindow * 0.08) - x0);
    const pk = _tlNorm(f.peak) * halfH, rm = _tlNorm(f.rms) * halfH;
    c.fillStyle = '#333';
    c.fillRect(x0, waveMid - pk, bw, pk * 2);
    c.fillStyle = '#7af';
    c.fillRect(x0, waveMid - rm, bw, rm * 2);
    // the voice layer: amplitude scaled by speech probability, so it stands tall only when the
    // signal is both loud and actually speech. a fridge hum stays blue, your voice goes green
    if (f.vad != null) {
      const vc = _tlNorm(f.rms * f.vad) * halfH;
      c.fillStyle = '#afa';
      c.fillRect(x0, waveMid - vc, bw, vc * 2);
    }
  }

  // detector traces — sparse, only one model runs at a time, so break the line across gaps
  for (const [key, colour] of [['score', '#7af'], ['vad', '#afa']]) {
    c.strokeStyle = colour;
    c.lineWidth = 1;
    c.beginPath();
    let open = false;
    for (const f of tlFrames) {
      if (f.ts < start - 1 || f.ts > tlEnd) continue;
      if (f[key] == null) { open = false; continue; }
      const px = x(f.ts), py = detTop + TL_DET_H * (1 - f[key]);
      if (open) c.lineTo(px, py); else { c.moveTo(px, py); open = true; }
    }
    c.stroke();
  }

  // event markers, full height with a label in the top strip
  c.font = "10px 'Cousine', monospace";
  c.textBaseline = 'top';
  let lastLabelX = -Infinity;
  for (const m of tlMarkers) {
    if (m.ts < start || m.ts > tlEnd) continue;
    const px = Math.round(x(m.ts)) + 0.5;
    const colour = TL_KIND_COLOURS[m.kind] || '#888';
    c.strokeStyle = colour;
    c.beginPath(); c.moveTo(px, TL_LABEL_H); c.lineTo(px, h); c.stroke();
    // labels collide when events land within a frame of each other — drop the ones that would overlap
    if (px - lastLabelX > 46) {
      c.fillStyle = colour;
      c.fillText(m.kind, px + 2, 1);
      lastLabelX = px;
    }
  }

  // window bounds, right-aligned so it does not sit under the marker labels
  c.fillStyle = '#444';
  c.textBaseline = 'bottom';
  const age = latest - tlEnd;
  c.fillText(age > 1 ? `-${age.toFixed(0)}s` : 'now', w - 34, h - 2);
}

// drag to pan back through the buffer, pointer events so it works with touch
(function initTimelineDrag() {
  const canvas = document.getElementById('tl-canvas');
  let dragging = false, lastX = 0;
  canvas.addEventListener('pointerdown', e => {
    dragging = true;
    lastX = e.clientX;
    canvas.classList.add('dragging');
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - lastX;
    lastX = e.clientX;
    if (!dx) return;
    tlLive = false;
    document.getElementById('tl-live').classList.remove('on');
    tlEnd -= dx / canvas.clientWidth * tlWindow;
    // do not let the view run past either end of what the buffer holds
    if (tlFrames.length) {
      const latest = tlFrames[tlFrames.length - 1].ts;
      const oldest = tlFrames[0].ts;
      tlEnd = Math.max(oldest + tlWindow, Math.min(latest, tlEnd));
      if (tlEnd >= latest) goLive();
    }
  });
  const end = e => {
    dragging = false;
    canvas.classList.remove('dragging');
    if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
  };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
})();

// status + history polling
async function updateStatus() {
  try {
    const res = await fetch('/status');
    const data = await res.json();
    if (data.ip && data.ip !== 'unknown') {
      document.getElementById('host-ip').textContent = data.ip + ':' + (data.port || 8000);
    }
    if (data.state_name) document.getElementById('tl-state').textContent = data.state_name;
    tlWakeThreshold = data.wake_threshold;
    tlVadThreshold = data.vad_threshold;
  } catch {}
  await syncHistory();
  await syncConsole();
  await syncSpeakers();
}
setInterval(updateStatus, 2000);
updateStatus();
